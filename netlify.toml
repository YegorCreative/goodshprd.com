[build]
command = "npm run build"
functions = "netlify/functions"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

[functions]
node_bundler = "esbuild"
included_files = ["admin/finance/index.html"]

[[redirects]]
from = "/admin"
to = "/.netlify/functions/admin"
status = 200
force = true

[[redirects]]
from = "/admin/"
to = "/.netlify/functions/admin"
status = 200
force = true

[[redirects]]
from = "/admin/finance"
to = "/.netlify/functions/finance-page"
status = 200
force = true

[[redirects]]
from = "/admin/finance/*"
to = "/.netlify/functions/finance-page"
status = 200
force = true

[[redirects]]
from = "/api/auth/:action"
to = "/.netlify/functions/finance?finance_route=/api/auth/:action"
status = 200
force = true

[[redirects]]
from = "/api/admin/finance/:resource"
to = "/.netlify/functions/finance?finance_route=/api/admin/finance/:resource"
status = 200
force = true

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

[[headers]]
for = "/admin/*"
[headers.values]
X-Frame-Options = "SAMEORIGIN"
Cache-Control = "no-cache, no-store, must-revalidate"
